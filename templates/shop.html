<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Guitar Shop</title>
    {% load static %}
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #f9f9f9;
        }

        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1.5rem 0;
        }

        nav {
            background-color: #555;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 0.5rem;
            font-size: 1rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffcc00;
        }

        main {
            padding: 2rem 1rem;
        }

        h2 {
            text-align: center;
            margin-bottom: 2rem;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .col-md-4 {
            flex: 1 1 calc(33.333% - 1rem);
            max-width: calc(33.333% - 1rem);
            box-sizing: border-box;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: auto;
        }

        .card-body {
            padding: 1rem;
            text-align: center;
        }

        .card-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .fw-bold {
            font-weight: bold;
            color: #555;
        }

        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Shop Guitars</h1>
        <p>Explore our collection and find your perfect match.</p>
    </header>

    <!-- Navigation -->
    <nav>
        <div class="navbar-brand">Guitar Shop</div>
        <div>
            <a href="/">Home</a>
            <a href="/shop" class="active">Shop</a>
            <a href="/about">About Us</a>
            <a href="/contact/">Contact</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <h2>Our Guitars</h2>
        <div class="row">
            <!-- Product Cards -->
            <div class="col-md-4">
                <div class="card">
                    <img src="{% static 'images/acousticguitar.jpg' %}" alt="Acoustic Guitar">
                    <div class="card-body">
                        <h5 class="card-title">Acoustic Guitar</h5>
                        <p class="fw-bold">$299.99</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img src="{% static 'images/electricguitar.jpg' %}" alt="Electric Guitar">
                    <div class="card-body">
                        <h5 class="card-title">Electric Guitar</h5>
                        <p class="fw-bold">$499.99</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img src="{% static 'images/bassguitarrr.jpg' %}" alt="Bass Guitar">
                    <div class="card-body">
                        <h5 class="card-title">Bass Guitar</h5>
                        <p class="fw-bold">$399.99</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Guitar Shop. All rights reserved.</p>
    </footer>
</body>
</html>
